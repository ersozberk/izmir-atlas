name: İzmir Nöbetçi Eczane Senkronizasyonu

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: 

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur (2026 Standartları)
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Node uyarılarını temizlemek için 24'e çektik

      - name: Monorepo Bağımlılıklarını Yükle
        # Artık spesifik bir klasöre girmiyoruz. Kök dizinde çalıştırıp 
        # npm'in tüm workspaces (apps, services vs.) paketlerini akıllıca yüklemesini sağlıyoruz.
        run: npm install

      - name: Senkronizasyon Scriptini Çalıştır
        working-directory: ./services/ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-eczaneler.js