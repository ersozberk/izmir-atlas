name: İzmir Nöbetçi Eczane Senkronizasyonu

on:
  schedule:
    # Her gün sabah saat 08:15'te çalışır (Zaman dilimi UTC'dir, Türkiye UTC+3 olduğu için 05:15 yazıyoruz)
    - cron: '15 5 * * *'
  
  # Manuel olarak tetiklemek istersek (Test için harika)
  workflow_dispatch: 

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları Yükle
        working-directory: ./services/ingestion
        run: npm install

      - name: Senkronizasyon Scriptini Çalıştır
        working-directory: ./services/ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-eczaneler.js